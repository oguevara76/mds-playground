# Publica el playground Angular vía rama gh-pages (push git).
# Evita la cola de actions/deploy-pages (deployment_queued / locks).
#
# Una sola vez tras el primer deploy exitoso de este workflow:
# Settings → Pages → Build and deployment → Source: Deploy from a branch
# Branch: gh-pages / folder: / (root)

name: Deploy GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build Angular (github-pages)
        run: pnpm run build:pages

      - name: Assemble site
        run: |
          mkdir -p _site
          cp -r dist/playground/browser/* _site/
          cp _site/index.html _site/404.html

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages
          force_orphan: true
          commit_message: 'deploy: update GitHub Pages site'
