<div class="cards-grid form-catalog-stack">
  <div class="catalog-preview mds-header-showcase" [style.--mds-header-catalog-demo-height]="demoHeight">
    <section id="pg-mds-header" class="preview-section preview-section--flush catalog-block-section" tabindex="-1">
      <header class="catalog-block-head">
        <h3 class="section-title component-title-primary">{{ 'MDS Header' | catalogBlockHeadTitle }}</h3>
      </header>

      <div class="catalog-block-body">
        <mds-catalog-preview-frame
          class="btn-section catalog-preview-section"
          [showCode]="true"
          configAriaLabel="Configurar MDS Header"
          codeAriaLabel="Mostrar código de uso de MDS Header"
        >
          <div catalogPreviewDemo class="mds-header-catalog-demo-area catalog-showcase-interactive">
            @if (liveState(); as state) {
              <mds-header
                class="mds-header-catalog-live"
                [productName]="state.productName"
                [showLocation]="state.showLocation"
                [timezones]="timezones"
                [showExternalComm]="state.showExternalComm"
                [externalCommBadges]="externalCommBadges"
                [showNotifications]="state.showNotifications"
                [userName]="state.userName"
                [userRole]="state.userRole"
                [showProfileOverlay]="state.showProfileOverlay"
              />
            }
          </div>

          <ng-container catalogPreviewConfig>
            <div [formGroup]="configForm" class="button-config-popover-stack">
              <div class="button-config-size-field">
                <span class="input-config-label">Product name</span>
                <input pInputText formControlName="productName" aria-label="Product name" />
              </div>

              <p-divider styleClass="button-config-divider" />

              <div class="input-config-row">
                <span class="input-config-label">Location</span>
                <p-toggleswitch formControlName="showLocation" ariaLabel="Location" />
              </div>

              <div class="input-config-row">
                <span class="input-config-label">External communication</span>
                <p-toggleswitch formControlName="showExternalComm" ariaLabel="External communication" />
              </div>

              <div class="input-config-row">
                <span class="input-config-label">Notifications</span>
                <p-toggleswitch formControlName="showNotifications" ariaLabel="Notifications" />
              </div>

              <p-divider styleClass="button-config-divider" />

              <p class="mds-header-config-section-label">Profile</p>

              <div class="input-config-row">
                <span class="input-config-label">Profile overlay</span>
                <p-toggleswitch formControlName="showProfileOverlay" ariaLabel="Profile overlay" />
              </div>
              <div class="button-config-size-field">
                <span class="input-config-label">Name</span>
                <input pInputText formControlName="userName" aria-label="Profile name" />
              </div>
              <div class="button-config-size-field">
                <span class="input-config-label">Secondary text</span>
                <input pInputText formControlName="userRole" aria-label="Profile secondary text" />
              </div>
            </div>
          </ng-container>

          <ng-container catalogPreviewCode>
            <mds-catalog-info-block title="Code" icon="code">
              <mds-catalog-code-copy-button
                catalogInfoBlockActions
                [code]="usageCode()"
              />
              <mds-catalog-code-snippet
                [code]="usageCode()"
                [hideToolbar]="true"
                ariaLabel="Código de uso de mds-header"
              />
            </mds-catalog-info-block>
          </ng-container>
        </mds-catalog-preview-frame>
      </div>
    </section>
  </div>

  <div class="catalog-preview mds-footer-showcase" [style.--mds-footer-catalog-demo-height]="footerDemoHeight">
    <section id="pg-mds-footer" class="preview-section preview-section--flush catalog-block-section" tabindex="-1">
      <header class="catalog-block-head">
        <h3 class="section-title component-title-primary">{{ 'MDS Footer' | catalogBlockHeadTitle }}</h3>
      </header>

      <div class="catalog-block-body">
        <mds-catalog-preview-frame
          class="btn-section catalog-preview-section"
          [showConfig]="false"
          [showCode]="true"
          codeAriaLabel="Mostrar código de uso de MDS Footer"
        >
          <div catalogPreviewDemo class="mds-footer-catalog-demo-area catalog-showcase-interactive">
            <mds-footer class="mds-footer-catalog-live" />
          </div>

          <ng-container catalogPreviewCode>
            <mds-catalog-info-block title="Code" icon="code">
              <mds-catalog-code-copy-button
                catalogInfoBlockActions
                [code]="footerUsageCode"
              />
              <mds-catalog-code-snippet
                [code]="footerUsageCode"
                [hideToolbar]="true"
                ariaLabel="Código de uso de mds-footer"
              />
            </mds-catalog-info-block>
          </ng-container>
        </mds-catalog-preview-frame>
      </div>
    </section>
  </div>
</div>
